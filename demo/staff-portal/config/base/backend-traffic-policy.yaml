apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: staff-portal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: staff-portal
  tcpKeepalive:
    idleTime: 60s
    interval: 15s
    probes: 3
  timeout:
    http:
      requestTimeout: '0s'
      # Must stay below the portal's keep-alive timeout (75s, in
      # app/server/adapter/node.ts) so Envoy closes idle upstream connections
      # before the portal does.
      connectionIdleTimeout: 60s
