name: Code Checks & Tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  CYPRESS_BASE_URL: http://localhost:3000
  CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
  NPM_CACHE: ~/.npm

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.NPM_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('**/package-lock.json', '**/package.json', '.npmrc') }}
          restore-keys: |
            ${{ runner.os }}-deps-v1-

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Cache Build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: build
          key: build-v1-${{ github.sha }}
          restore-keys: |
            build-v1-

  code-quality:
    needs: setup
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.NPM_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('**/package-lock.json', '**/package.json', '.npmrc') }}

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Run Lint
        run: npm run lint

      - name: Run Format Check
        run: npm run format:check

      - name: Run Typecheck
        run: npm run typecheck

  build:
    needs: code-quality
    name: Build
    runs-on: ubuntu-latest
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.NPM_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('**/package-lock.json', '**/package.json', '.npmrc') }}

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Cache Build
        uses: actions/cache@v5
        with:
          path: build
          key: build-v1-${{ github.sha }}

  test:
    needs: build
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore Dependencies Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.NPM_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('**/package-lock.json', '**/package.json', '.npmrc') }}

      - name: Restore Build Cache
        uses: actions/cache@v5
        with:
          path: build
          key: build-v1-${{ github.sha }}

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Run Unit Tests
        id: unit
        run: NODE_ENV=development npm run test:unit:prod

      - name: Setup Cypress
        run: |
          echo "Installing Cypress..."
          npx cypress install
          echo "Verifying Cypress installation..."
          npx cypress verify

      - name: Setup E2E Environment
        run: |
          echo "CYPRESS_BASE_URL=${CYPRESS_BASE_URL}" > .env
          echo "NODE_ENV=${NODE_ENV}" >> .env

      # - name: Run E2E Tests
      #   id: e2e
      #   run: npm run test:e2e:prod

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            cypress/videos
            cypress/screenshots
            cypress/results
          retention-days: 7
          compression-level: 9
          if-no-files-found: warn

  status:
    needs: [setup, code-quality, build, test]
    name: Final Status
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Workflow Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Workflow failed because one or more jobs failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ Workflow cancelled because one or more jobs were cancelled"
            exit 1
          else
            echo "✅ All jobs completed successfully"
          fi
